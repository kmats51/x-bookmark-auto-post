name: Xブックマーク自動引用投稿

on:
  schedule:
    # JST 18:00 = UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bookmark-post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 実行時刻を確認
        run: echo "JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: ブックマーク自動投稿を実行
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python github_bookmark_poster.py

      - name: 処理結果をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add x_tokens.json processed_tweets.json
          git commit -m "Auto: ブックマーク投稿処理 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" || exit 0
          git push origin main || echo "⚠️ Push失敗（変更なしの可能性）"
